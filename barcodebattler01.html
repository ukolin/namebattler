<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアル・バーコードバトラー Web版</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { text-align: center; font-family: 'Courier New', sans-serif; background-color: #f0f0f0; padding: 20px; }
        .container { background-color: white; display: inline-block; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        .flex-inputs { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .input-box { background-color: #eef5ff; padding: 15px; border-radius: 8px; width: 45%; }
        .scan-status { font-size: 14px; color: #666; font-weight: bold; margin-top: 5px; min-height: 20px; word-break: break-all; }
        button { font-size: 18px; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
        .btn-scan { background-color: #007AFF; color: white; }
        .btn-battle { background-color: #FF9500; color: white; width: 100%; font-size: 22px; margin-top: 15px; }
        .btn-battle:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* カメラ表示エリアのスタイル */
        #camera-area { width: 100%; max-width: 300px; margin: 20px auto; border: 2px solid #333; border-radius: 8px; display: none; overflow: hidden; }
        #battle-log { text-align: left; background-color: #333; color: #00FF00; padding: 15px; border-radius: 5px; height: 250px; overflow-y: auto; font-size: 14px; line-height: 1.6; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>リアル・バーコードバトラー</h1>
    
    <div id="camera-area">
        <div id="reader"></div>
    </div>
    
    <div class="flex-inputs">
        <div class="input-box">
            <strong>プレイヤー (自分)</strong><br>
            <button class="btn-scan" id="p-scan-btn">バーコード走査</button>
            <div class="scan-status" id="p-code">CODE: 未読込</div>
            <div id="p-status" style="margin-top: 10px; font-size: 12px; color: #444;"></div>
        </div>
        
        <div class="input-box" style="background-color: #ffeef0;">
            <strong>エネミー (敵)</strong><br>
            <button class="btn-scan" id="e-scan-btn" style="background-color: #d9534f;">バーコード走査</button>
            <div class="scan-status" id="e-code">CODE: 未読込</div>
            <div id="e-status" style="margin-top: 10px; font-size: 12px; color: #444;"></div>
        </div>
    </div>

    <button class="btn-battle" id="battle-btn" disabled>バトル開始！</button>

    <div id="battle-log">両方のバーコードをスキャンするとバトルが解禁されます...</div>
</div>

<script>
let playerCode = "";
let enemyCode = "";
let html5QrcodeScanner = null;

const prefixes = ["伝説の", "暗黒の", "光の", "迷える", "爆速の", "鋼鉄の", "古代の", "野生の", "うるわしの", "虚無の"];
const tribes = ["スライム", "ドラゴン", "ロボット", "ゴーレム", "ファイター", "マジシャン", "バード", "ビースト", "ゴースト", "オーク"];

// バーコードスキャンを開始する関数
function startBarcodeScan(target) {
    const cameraArea = document.getElementById('camera-area');
    cameraArea.style.display = "block"; // カメラ枠を表示

    // すでにスキャナーが動いていたら一回止める
    if (html5QrcodeScanner) {
        html5QrcodeScanner.clear();
    }

    // スキャナーの初期化設定（JANコードなどの一次元バーコードを狙い撃ち）
    html5QrcodeScanner = new Html5Qrcode("reader");
    
    html5QrcodeScanner.start(
        { facingMode: "environment" }, // 背面カメラを使用
        {
            fps: 10,
            qrbox: { width: 250, height: 150 } // バーコードが入りやすい横長の枠
        },
        async (decodedText) => {
            // スキャン成功時の処理
            document.getElementById(`${target}-code`).textContent = "CODE: " + decodedText;
            
            if (target === 'p') {
                playerCode = decodedText;
                const char = await generateStatus(decodedText);
                document.getElementById('p-status').innerHTML = `<strong>${char.name}</strong><br>HP: ${char.maxHp} / ATK: ${char.attack} / DEF: ${char.defense}`;
            } else {
                enemyCode = decodedText;
                const char = await generateStatus(decodedText);
                document.getElementById('e-status').innerHTML = `<strong>${char.name}</strong><br>HP: ${char.maxHp} / ATK: ${char.attack} / DEF: ${char.defense}`;
            }

            // スキャナーを止めてカメラ枠を閉じる
            html5QrcodeScanner.stop();
            cameraArea.style.display = "none";
            checkReady();
        },
        (errorMessage) => {
            // 走査中は毎フレームエラー（不一致）が出るので、ここは何も処理せずスルー
        }
    ).catch((err) => {
        alert("カメラの起動に失敗しました: " + err);
        cameraArea.style.display = "none";
    });
}

document.getElementById('p-scan-btn').addEventListener('click', () => startBarcodeScan('p'));
document.getElementById('e-scan-btn').addEventListener('click', () => startBarcodeScan('e'));

function checkReady() {
    if (playerCode && enemyCode) {
        document.getElementById('battle-btn').disabled = false;
        document.getElementById('battle-log').textContent = "バーコード解析完了！いつでも戦えます。";
    }
}

// ステータス生成ロジック（読み込んだバーコードの数字文字列をハッシュ化）
async function generateStatus(inputStr) {
    const encoder = new TextEncoder();
    const data = encoder.encode(inputStr);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = new Uint8Array(hashBuffer);

    const mixAtk = (hashArray[0] + hashArray[3] + hashArray[6]) / 3;
    const mixDef = (hashArray[1] + hashArray[4] + hashArray[7]) / 3;
    const mixHp  = (hashArray[2] + hashArray[5] + hashArray[8]) / 3;

    const prefixIndex = hashArray[9] % prefixes.length;
    const tribeIndex = hashArray[10] % tribes.length;
    const fullName = `${prefixes[prefixIndex]}${tribes[tribeIndex]}`;

    return {
        name: fullName,
        maxHp: Math.floor((mixHp / 255) * (120 - 50)) + 50,
        hp: 0,
        attack: Math.floor((mixAtk / 255) * (50 - 5)) + 5,
        defense: Math.floor((mixDef / 255) * (50 - 5)) + 5
    };
}

// バトルロジック（完全移植）
document.getElementById('battle-btn').addEventListener('click', async () => {
    const logBox = document.getElementById('battle-log');
    const playerRaw = await generateStatus(playerCode);
    const enemyRaw  = await generateStatus(enemyCode);

    const player = structuredClone(playerRaw);
    const enemy  = structuredClone(enemyRaw);
    player.name += "(自分)";
    enemy.name += "(敵)";
    player.hp = player.maxHp;
    enemy.hp = enemy.maxHp;

    let logHtml = `【${player.name} VS ${enemy.name} バトルスタート！】<br>`;
    let turn = 1;

    while (player.hp > 0 && enemy.hp > 0) {
        logHtml += `<br>--- ターン ${turn} ---<br>`;

        let pDamage = player.attack - enemy.defense;
        let isPlayerCritical = (Math.random() * 100) < 10;
        if (isPlayerCritical) {
            pDamage = player.attack;
            logHtml += `✨ <strong>【会心の一撃！】</strong> `;
        } else if (pDamage <= 0) {
            pDamage = 3;
        }
        enemy.hp -= pDamage;
        if (enemy.hp < 0) enemy.hp = 0;
        logHtml += `⚔️ ${player.name}の攻撃！ ${enemy.name}に ${pDamage} のダメージ！ (残りHP: ${enemy.hp})<br>`;

        if (enemy.hp <= 0) break;

        let eDamage = enemy.attack - player.defense;
        let isEnemyCritical = (Math.random() * 100) < 10;
        if (isEnemyCritical) {
            eDamage = enemy.attack;
            logHtml += `💥 <strong>【痛恨の一撃！】</strong> `;
        } else if (eDamage <= 0) {
            eDamage = 3;
        }
        player.hp -= eDamage;
        if (player.hp < 0) player.hp = 0;
        logHtml += `💥 ${enemy.name}の攻撃！ ${player.name}に ${eDamage} のダメージ！ (残りHP: ${player.hp})<br>`;

        turn++;
        if (turn > 100) { logHtml += "<br>ドロー！<br>"; break; }
    }

    logHtml += "<br>=======================<br>";
    if (player.hp > 0 && enemy.hp <= 0) { logHtml += `🎉 【勝利】 ${player.name}の勝ち！`; } 
    else if (enemy.hp > 0 && player.hp <= 0) { logHtml += `💀 【敗北】 ${enemy.name}の勝ち...`; } 
    else { logHtml += `🤝 【引き分け】`; }

    logBox.innerHTML = logHtml;
    logBox.scrollTop = logBox.scrollHeight;
});
</script>

</body>
</html>
